name: native_datastore
description: >-
  Type-safe, async-first key-value storage for Flutter, backed by Android
  Jetpack DataStore and iOS UserDefaults. A modern alternative to
  shared_preferences.
version: 1.7.0
homepage: https://sudhi.in
repository: https://github.com/sudhi001/native_datastore
issue_tracker: https://github.com/sudhi001/native_datastore/issues
documentation: https://sudhi001.github.io/native_datastore/
topics:
  - storage
  - datastore
  - preferences
  - persistence
  - keyvalue

environment:
  sdk: ^3.11.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.0.0

flutter:
  plugin:
    platforms:
      android:
        package: in.sudhi.native_datastore
        pluginClass: NativeDatastorePlugin
      ios:
        pluginClass: NativeDatastorePlugin
