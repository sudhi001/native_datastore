name: 💡 Feature request
description: Suggest an idea or enhancement
labels: [enhancement]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched [existing issues](https://github.com/sudhi001/native_datastore/issues) and this isn't a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What API or behavior would you like? A code sketch of the ideal usage helps.
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Relevant platform(s)
      multiple: true
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other packages that do this.
