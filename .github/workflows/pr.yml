name: PR

# Runs on every pull request targeting main. The `test` job is a required
# status check for the protected `main` branch (see branch protection rules),
# so a PR can only merge once analysis and unit tests pass.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test --coverage

      - name: Coverage gate
        run: ./tool/check_coverage.sh
