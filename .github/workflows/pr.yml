name: PR

# Runs on every pull request targeting main. The `checks` job is a required
# status check for the protected `main` branch (see branch protection rules),
# so a PR can only merge once every gate in checks.yml passes.
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
