name: Release

# Triggered by pushing a tag matching v* (e.g. v1.3.0). The tag push itself
# is the release signal — bump version in pubspec.yaml, commit, then:
#
#   git tag v1.3.0
#   git push origin v1.3.0
#
# `workflow_dispatch` is kept for manual reruns; when you dispatch, pick the
# tag ref from the "Run workflow" dropdown so pub.dev's tag-pattern check
# (v{{version}}) still passes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

  publish:
    name: Publish and release
    needs: test
    runs-on: ubuntu-latest
    # Only run if the workflow was triggered by a tag (skips dispatches on
    # branch refs that wouldn't satisfy pub.dev's tag-pattern policy anyway).
    if: startsWith(github.ref, 'refs/tags/v')
    # `id-token: write` lets `dart pub publish` exchange a GitHub OIDC token
    # for a pub.dev publish credential — no API key in the repo. Requires
    # automated publishing to be configured for this repo on pub.dev with
    # Tag pattern `v{{version}}`.
    # `contents: write` lets the workflow create the GitHub Release.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read version from pubspec.yaml
        id: pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "expected_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches pubspec version
        env:
          REF: ${{ github.ref }}
          EXPECTED_TAG: ${{ steps.pubspec.outputs.expected_tag }}
        run: |
          ACTUAL_TAG="${REF#refs/tags/}"
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag $ACTUAL_TAG does not match pubspec version. Expected $EXPECTED_TAG."
            exit 1
          fi
          echo "Releasing $EXPECTED_TAG"

      - name: Validate package (dry-run)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        # OIDC: pub.dev sees the GitHub-issued token (with the tag ref baked
        # into its claims) and authorizes the upload after checking the
        # tag-pattern v{{version}} policy. No stored API key.
        run: dart pub publish --force

      - name: Create GitHub Release
        env:
          TAG: ${{ steps.pubspec.outputs.expected_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
