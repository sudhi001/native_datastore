# SwiftLint configuration for the iOS plugin sources.
#
# Deliberately narrow: the goal is to catch real defects (force unwraps that
# can crash a host app, unused results from Keychain calls), not to impose a
# formatting convention on a codebase that already reads consistently. Size
# rules are off because the two plugin classes are intentionally one type per
# Pigeon API, which those rules would flag forever without anything to fix.
included:
  - ios/native_datastore/Sources/native_datastore

excluded:
  # Pigeon output — regenerated by tool/generate_pigeon.sh, never hand-edited.
  - ios/native_datastore/Sources/native_datastore/Messages.g.swift

disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
